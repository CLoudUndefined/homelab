<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Icon Generator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --bg: #f9fafb;
            --text: #1f2937;
            --border: #e5e7eb;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            padding: 2rem;
        }
        
        h1 {
            font-weight: 700;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--text);
        }
        
        p {
            margin-bottom: 1.5rem;
            color: #4b5563;
        }
        
        .generator {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            background-color: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 1.5rem;
        }
        
        .input-group {
            display: flex;
            gap: 0.5rem;
        }
        
        input {
            flex: 1;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }
        
        button {
            background-color: var(--primary);
            color: white;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        button:hover {
            background-color: #4338ca;
        }
        
        .canvas-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .canvas-wrapper {
            background-color: #f3f4f6;
            border-radius: 0.5rem;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
        }
        
        canvas {
            image-rendering: pixelated;
            max-width: 100%;
            height: auto;
        }
        
        .color-info {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .color-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: #4b5563;
        }
        
        .color-sample {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            border: 1px solid var(--border);
        }
        
        .history {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .history-item {
            cursor: pointer;
            border-radius: 0.5rem;
            padding: 0.25rem;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        
        .history-item:hover {
            border-color: var(--primary-light);
        }
        
        .history-canvas {
            width: 50px;
            height: 50px;
            image-rendering: pixelated;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            height: 100%;
            text-align: center;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Icon Generator</h1>
        <p>Enter any text to generate a unique pixel icon based on its MD5 hash.</p>
        
        <div class="generator">
            <div class="input-group">
                <input type="text" id="input-text" placeholder="Enter text to generate an icon..." 
                       aria-label="Text for generation">
                <button id="generate-btn">Generate</button>
            </div>
            
            <div class="canvas-container">
                <div class="canvas-wrapper" id="canvas-wrapper">
                    <div class="empty-state">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <path d="M20.4 14.5L16 10 4 20"></path>
                        </svg>
                        <p>Enter text and click "Generate"</p>
                    </div>
                    <canvas id="icon-canvas" width="150" height="150" style="display: none;"></canvas>
                </div>
                
                <div class="color-info" id="color-info" style="display: none;">
                </div>
            </div>
            
            <div class="history" id="history">
            </div>
        </div>
    </div>

    <script>
        function md5(inputString) {
            const hc = "0123456789abcdef";
            function rh(n) { let j, s = ""; for (j = 0; j <= 3; j++) s += hc.charAt((n >> (j * 8 + 4)) & 0x0F) + hc.charAt((n >> (j * 8)) & 0x0F); return s; }
            function ad(x, y) { let l = (x & 0xFFFF) + (y & 0xFFFF); let m = (x >> 16) + (y >> 16) + (l >> 16); return (m << 16) | (l & 0xFFFF); }
            function rl(n, c) { return (n << c) | (n >>> (32 - c)); }
            function cm(q, a, b, x, s, t) { return ad(rl(ad(ad(a, q), ad(x, t)), s), b); }
            function ff(a, b, c, d, x, s, t) { return cm((b & c) | ((~b) & d), a, b, x, s, t); }
            function gg(a, b, c, d, x, s, t) { return cm((b & d) | (c & (~d)), a, b, x, s, t); }
            function hh(a, b, c, d, x, s, t) { return cm(b ^ c ^ d, a, b, x, s, t); }
            function ii(a, b, c, d, x, s, t) { return cm(c ^ (b | (~d)), a, b, x, s, t); }
            function sb(x) {
                let i; let nblk = ((x.length + 8) >> 6) + 1; let blks = new Array(nblk * 16); for (i = 0; i < nblk * 16; i++) blks[i] = 0;
                for (i = 0; i < x.length; i++) blks[i >> 2] |= x.charCodeAt(i) << ((i % 4) * 8);
                blks[i >> 2] |= 0x80 << ((i % 4) * 8); blks[nblk * 16 - 2] = x.length * 8; return blks;
            }
            
            let x = sb(inputString);
            let a = 1732584193;
            let b = -271733879;
            let c = -1732584194;
            let d = 271733878;
            
            for (let i = 0; i < x.length; i += 16) {
                let olda = a;
                let oldb = b;
                let oldc = c;
                let oldd = d;
                
                a = ff(a, b, c, d, x[i+ 0], 7 , -680876936);
                d = ff(d, a, b, c, x[i+ 1], 12, -389564586);
                c = ff(c, d, a, b, x[i+ 2], 17, 606105819);
                b = ff(b, c, d, a, x[i+ 3], 22, -1044525330);
                a = ff(a, b, c, d, x[i+ 4], 7 , -176418897);
                d = ff(d, a, b, c, x[i+ 5], 12, 1200080426);
                c = ff(c, d, a, b, x[i+ 6], 17, -1473231341);
                b = ff(b, c, d, a, x[i+ 7], 22, -45705983);
                a = ff(a, b, c, d, x[i+ 8], 7 , 1770035416);
                d = ff(d, a, b, c, x[i+ 9], 12, -1958414417);
                c = ff(c, d, a, b, x[i+10], 17, -42063);
                b = ff(b, c, d, a, x[i+11], 22, -1990404162);
                a = ff(a, b, c, d, x[i+12], 7 , 1804603682);
                d = ff(d, a, b, c, x[i+13], 12, -40341101);
                c = ff(c, d, a, b, x[i+14], 17, -1502002290);
                b = ff(b, c, d, a, x[i+15], 22, 1236535329);
                
                a = gg(a, b, c, d, x[i+ 1], 5 , -165796510);
                d = gg(d, a, b, c, x[i+ 6], 9 , -1069501632);
                c = gg(c, d, a, b, x[i+11], 14, 643717713);
                b = gg(b, c, d, a, x[i+ 0], 20, -373897302);
                a = gg(a, b, c, d, x[i+ 5], 5 , -701558691);
                d = gg(d, a, b, c, x[i+10], 9 , 38016083);
                c = gg(c, d, a, b, x[i+15], 14, -660478335);
                b = gg(b, c, d, a, x[i+ 4], 20, -405537848);
                a = gg(a, b, c, d, x[i+ 9], 5 , 568446438);
                d = gg(d, a, b, c, x[i+14], 9 , -1019803690);
                c = gg(c, d, a, b, x[i+ 3], 14, -187363961);
                b = gg(b, c, d, a, x[i+ 8], 20, 1163531501);
                a = gg(a, b, c, d, x[i+13], 5 , -1444681467);
                d = gg(d, a, b, c, x[i+ 2], 9 , -51403784);
                c = gg(c, d, a, b, x[i+ 7], 14, 1735328473);
                b = gg(b, c, d, a, x[i+12], 20, -1926607734);
                
                a = hh(a, b, c, d, x[i+ 5], 4 , -378558);
                d = hh(d, a, b, c, x[i+ 8], 11, -2022574463);
                c = hh(c, d, a, b, x[i+11], 16, 1839030562);
                b = hh(b, c, d, a, x[i+14], 23, -35309556);
                a = hh(a, b, c, d, x[i+ 1], 4 , -1530992060);
                d = hh(d, a, b, c, x[i+ 4], 11, 1272893353);
                c = hh(c, d, a, b, x[i+ 7], 16, -155497632);
                b = hh(b, c, d, a, x[i+10], 23, -1094730640);
                a = hh(a, b, c, d, x[i+13], 4 , 681279174);
                d = hh(d, a, b, c, x[i+ 0], 11, -358537222);
                c = hh(c, d, a, b, x[i+ 3], 16, -722521979);
                b = hh(b, c, d, a, x[i+ 6], 23, 76029189);
                a = hh(a, b, c, d, x[i+ 9], 4 , -640364487);
                d = hh(d, a, b, c, x[i+12], 11, -421815835);
                c = hh(c, d, a, b, x[i+15], 16, 530742520);
                b = hh(b, c, d, a, x[i+ 2], 23, -995338651);
                
                a = ii(a, b, c, d, x[i+ 0], 6 , -198630844);
                d = ii(d, a, b, c, x[i+ 7], 10, 1126891415);
                c = ii(c, d, a, b, x[i+14], 15, -1416354905);
                b = ii(b, c, d, a, x[i+ 5], 21, -57434055);
                a = ii(a, b, c, d, x[i+12], 6 , 1700485571);
                d = ii(d, a, b, c, x[i+ 3], 10, -1894986606);
                c = ii(c, d, a, b, x[i+10], 15, -1051523);
                b = ii(b, c, d, a, x[i+ 1], 21, -2054922799);
                a = ii(a, b, c, d, x[i+ 8], 6 , 1873313359);
                d = ii(d, a, b, c, x[i+15], 10, -30611744);
                c = ii(c, d, a, b, x[i+ 6], 15, -1560198380);
                b = ii(b, c, d, a, x[i+13], 21, 1309151649);
                a = ii(a, b, c, d, x[i+ 4], 6 , -145523070);
                d = ii(d, a, b, c, x[i+11], 10, -1120210379);
                c = ii(c, d, a, b, x[i+ 2], 15, 718787259);
                b = ii(b, c, d, a, x[i+ 9], 21, -343485551);
                
                a = ad(a, olda);
                b = ad(b, oldb);
                c = ad(c, oldc);
                d = ad(d, oldd);
            }
            return rh(a) + rh(b) + rh(c) + rh(d);
        }

        function hexToBytes(hex) {
            let bytes = [];
            for (let i = 0; i < hex.length; i += 2) {
                bytes.push(parseInt(hex.substr(i, 2), 16));
            }
            return bytes;
        }

        function generateBinaryStrings(hash) {
            let bigInt = 0n;
            for (let i = 0; i < 15; i++) {
                bigInt = (bigInt << 8n) | BigInt(hash[i]);
            }
            
            let binaryStr = bigInt.toString(2).padStart(120, '0').slice(0, 15);
            
            let binaryStrings = [];
            for (let i = 0; i < 15; i += 3) {
                let rowStr = binaryStr.slice(i, i + 3);
                binaryStrings.push(rowStr + rowStr.slice(0, 2).split('').reverse().join(''));
            }
            
            return binaryStrings;
        }

        function generateIcon(text) {
            const hashHex = md5(text);
            const hashBytes = hexToBytes(hashHex);
            
            const red = hashBytes[0];
            const green = hashBytes[1];
            const blue = hashBytes[2];
            
            const binaryStrings = generateBinaryStrings(hashBytes);
            
            displayColorInfo(red, green, blue);
            
            drawIcon(binaryStrings, red, green, blue);
            
            addToHistory(text, binaryStrings, red, green, blue);
            
            return { red, green, blue, binaryStrings };
        }

        function displayColorInfo(red, green, blue) {
            const colorInfoEl = document.getElementById('color-info');
            colorInfoEl.innerHTML = '';
            colorInfoEl.style.display = 'flex';
            
            const channels = [
                { name: 'Red', value: red },
                { name: 'Green', value: green },
                { name: 'Blue', value: blue },
                { name: 'HEX', value: `#${red.toString(16).padStart(2, '0')}${green.toString(16).padStart(2, '0')}${blue.toString(16).padStart(2, '0')}` }
            ];
            
            channels.forEach(channel => {
                const boxEl = document.createElement('div');
                boxEl.className = 'color-box';
                
                if (channel.name !== 'HEX') {
                    const sampleEl = document.createElement('div');
                    sampleEl.className = 'color-sample';
                    
                    if (channel.name === 'Red') {
                        sampleEl.style.backgroundColor = `rgb(${channel.value}, 0, 0)`;
                    } else if (channel.name === 'Green') {
                        sampleEl.style.backgroundColor = `rgb(0, ${channel.value}, 0)`;
                    } else if (channel.name === 'Blue') {
                        sampleEl.style.backgroundColor = `rgb(0, 0, ${channel.value})`;
                    }
                    
                    boxEl.appendChild(sampleEl);
                    boxEl.appendChild(document.createTextNode(`${channel.name}: ${channel.value}`));
                } else {
                    const sampleEl = document.createElement('div');
                    sampleEl.className = 'color-sample';
                    sampleEl.style.backgroundColor = channel.value;
                    
                    boxEl.appendChild(sampleEl);
                    boxEl.appendChild(document.createTextNode(`${channel.name}: ${channel.value}`));
                }
                
                colorInfoEl.appendChild(boxEl);
            });
        }

        function drawIcon(binaryStrings, red, green, blue) {
            const canvas = document.getElementById('icon-canvas');
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const pixelSize = canvas.width / 5;
            
            for (let y = 0; y < binaryStrings.length; y++) {
                const row = binaryStrings[y];
                
                for (let x = 0; x < row.length; x++) {
                    if (row[x] === '1') {
                        ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
                        ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                    }
                }
            }
            
            canvas.style.display = 'block';
            const emptyState = document.querySelector('.empty-state');
            if (emptyState) emptyState.style.display = 'none';
        }

        function addToHistory(text, binaryStrings, red, green, blue) {
            const historyEl = document.getElementById('history');
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            historyItem.title = text;
            
            const historyCanvas = document.createElement('canvas');
            historyCanvas.className = 'history-canvas';
            historyCanvas.width = 50;
            historyCanvas.height = 50;
            
            const ctx = historyCanvas.getContext('2d');
            const pixelSize = historyCanvas.width / 5;
            
            for (let y = 0; y < binaryStrings.length; y++) {
                const row = binaryStrings[y];
                
                for (let x = 0; x < row.length; x++) {
                    if (row[x] === '1') {
                        ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
                        ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                    }
                }
            }
            
            historyItem.appendChild(historyCanvas);
            
            historyItem.addEventListener('click', () => {
                document.getElementById('input-text').value = text;
                drawIcon(binaryStrings, red, green, blue);
                displayColorInfo(red, green, blue);
                
                document.getElementById('icon-canvas').style.display = 'block';
                const emptyState = document.querySelector('.empty-state');
                if (emptyState) emptyState.style.display = 'none';
            });
            
            historyEl.insertBefore(historyItem, historyEl.firstChild);
            
            if (historyEl.children.length > 12) {
                historyEl.removeChild(historyEl.lastChild);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const inputEl = document.getElementById('input-text');
            const generateBtn = document.getElementById('generate-btn');
            
            generateBtn.addEventListener('click', () => {
                const text = inputEl.value.trim();
                if (text) {
                    generateIcon(text);
                }
            });
            
            inputEl.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const text = inputEl.value.trim();
                    if (text) {
                        generateIcon(text);
                    }
                }
            });
            
            const defaultText = "Hello World";
            inputEl.value = defaultText;
            generateIcon(defaultText);
        });
    </script>
</body>
</html>
