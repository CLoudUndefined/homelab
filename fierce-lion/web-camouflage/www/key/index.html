<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icon</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #f0f0f0;
      }
      canvas {
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <canvas id="avatarCanvas" width="200" height="200"></canvas>
    <script>
      const canvas = document.getElementById("avatarCanvas");
      const ctx = canvas.getContext("2d");

      const gridSize = 3;
      const nodeRadius = 5;
      const cellSize = canvas.width / (gridSize + 1);
      const nodes = [];
      let path = [];

      for (let i = 1; i <= gridSize; i++) {
        for (let j = 1; j <= gridSize; j++) {
          nodes.push({ x: j * cellSize, y: i * cellSize });
        }
      }

      function generatePath() {
        path = [];
        const availableNodes = [...nodes];
        let currentNode = availableNodes.splice(
          Math.floor(Math.random() * availableNodes.length),
          1,
        )[0];
        path.push(currentNode);

        const pathLength = Math.floor(Math.random() * 3) + 3;
        while (path.length < pathLength && availableNodes.length > 0) {
          currentNode = availableNodes.splice(
            Math.floor(Math.random() * availableNodes.length),
            1,
          )[0];
          path.push(currentNode);
        }
      }

      function drawAvatar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        nodes.forEach((node) => {
          ctx.beginPath();
          ctx.arc(node.x, node.y, nodeRadius, 0, 2 * Math.PI);
          ctx.fill();
        });

        const hue = Math.random() * 360;
        ctx.strokeStyle = `hsla(${hue}, 70%, 50%, 0.7)`;
        ctx.lineWidth = 4;

        ctx.beginPath();
        path.forEach((node, index) => {
          if (index === 0) {
            ctx.moveTo(node.x, node.y);
          } else {
            ctx.lineTo(node.x, node.y);
          }
        });
        ctx.stroke();

        ctx.save();
        ctx.scale(-1, 1);
        ctx.translate(-canvas.width, 0);
        ctx.beginPath();
        path.forEach((node, index) => {
          if (index === 0) {
            ctx.moveTo(node.x, node.y);
          } else {
            ctx.lineTo(node.x, node.y);
          }
        });
        ctx.stroke();
        ctx.restore();
      }

      generatePath();
      drawAvatar();

      canvas.addEventListener("click", () => {
        generatePath();
        drawAvatar();
      });
    </script>
  </body>
</html>
