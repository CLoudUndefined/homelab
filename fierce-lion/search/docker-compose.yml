services:
  redis:
    image: valkey/valkey:8-alpine
    container_name: searxng-redis
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - internal
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID, DAC_OVERRIDE, CHOWN]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_DOMAIN}
      - UWSGI_WORKERS=2
      - UWSGI_THREADS=4
    networks:
      - internal
      - traefik-public
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.searxng-router.rule=Host(`${SEARXNG_DOMAIN}`)"
      - "traefik.http.routers.searxng-router.entrypoints=websecure"
      - "traefik.http.routers.searxng-router.tls.certresolver=myresolver"
      - "traefik.http.services.searxng-service.loadbalancer.server.port=8080"
      - "traefik.http.routers.searxng-router.middlewares=searxng-auth"
      - "traefik.http.middlewares.searxng-auth.basicauth.users=${SEARXNG_USER_AUTH}:${SEARXNG_HASH_PASSWORD_AUTH}"

networks:
  traefik-public:
    external: true
  internal:
    internal: true

volumes:
  redis-data:
