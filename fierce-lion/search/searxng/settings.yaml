  - name: core
    engine: core
    shortcut: co
    categories: [science]
    disabled: false
    weight: 3

  - name: crossref
    engine: crossref
    shortcut: cr
    categories: [science]
    disabled: false
    weight: 2
    timeout: 30

  - name: springer nature
    engine: springer
    shortcut: sn
    categories: [science]
    disabled: false
    weight: 2

  - name: marginalia
    engine: marginalia
    shortcut: ma
    categories: [it, general]
    disabled: false
    weight: 1

  - name: karmasearch
    engine: karmasearch
    disabled: true

  - name: karmasearch videos
    engine: karmasearch
    disabled: true

  - name: dblp
    engine: dblp
    shortcut: dblp
    categories: [security, science]
    weight: 4
    disabled: false

  - name: google scholar
    engine: google_scholar
    shortcut: gs
    categories: [science, it]
    weight: 4
    disabled: false

  - name: ietf datatracker
    engine: json_engine
    shortcut: ietf
    categories: [networking, dev]
    search_url: "https://datatracker.ietf.org/api/v1/doc/document/?name__icontains={query}&format=json"
    results_query: "objects"
    url_prefix: "https://datatracker.ietf.org/doc/"
    url_query: "name"
    title_query: "title"
    content_query: "abstract"
    disabled: false
    weight: 4

  - name: iacr eprint
    engine: xpath
    shortcut: iacr
    categories: [science, security]
    search_url: "https://eprint.iacr.org/search?q={query}"
    results_xpath: "//div[contains(@class, 'search-result') or contains(@class, 'paper')]"
    url_xpath: ".//a/@href"
    title_xpath: ".//b/text() | .//strong/text() | .//a/text()"
    content_xpath: ".//div[contains(@class, 'abstract')]/text() | .//p/text()"
    disabled: false
    weight: 3

  - name: ieee xplore
    engine: xpath
    shortcut: ieee
    categories: [it, science]
    paging: true
    search_url: "https://www.mojeek.com/search?q={query}&s={pageno}&foc=ieeexplore.ieee.org"
    results_xpath: "//ul[@class='ob-marks']/li"
    url_xpath: ".//a[@class='ob']/@href"
    title_xpath: ".//a[@class='ob']/text()"
    content_xpath: ".//p[@class='s']/text()"
    disabled: false
    weight: 2
