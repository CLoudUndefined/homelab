<!doctype html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Slider - MD3</title>
<link rel=stylesheet href=md3-theme.css><style>#slider-grid{display:grid;gap:6px;width:100%;max-width:340px;aspect-ratio:1/1;background:var(--md-sys-color-outline);padding:6px;border-radius:16px;box-sizing:border-box}.slider-cell{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);border-radius:8px;display:flex;justify-content:center;align-items:center;font-size:1.5rem;font-weight:700;cursor:pointer;transition:transform .1s,background .2s;user-select:none;-webkit-tap-highlight-color:transparent}.slider-cell.empty{background:0 0;cursor:default}</style><div class=card><h2>Slider Puzzle</h2><p class=desc>Slide tiles to arrange numbers in order.<div class=diff-selector><button class=diff-btn onclick='setDifficulty("easy")'>3x3</button>
<button class="diff-btn active" onclick='setDifficulty("medium")'>4x4</button>
<button class=diff-btn onclick='setDifficulty("hard")'>5x5</button></div><div id=slider-grid></div><div class=stats id=slider-score>Moves: 0</div></div><script>const config={easy:{size:3,shuffles:50},medium:{size:4,shuffles:150},hard:{size:5,shuffles:300}},game={diff:"medium",grid:[],moves:0,emptyIdx:0,container:document.getElementById("slider-grid"),scoreEl:document.getElementById("slider-score"),start(){const e=config[this.diff].size,t=e*e;this.moves=0,this.grid=Array.from({length:t},(e,t)=>t+1),this.grid[t-1]=0,this.emptyIdx=t-1;for(let t=0;t<config[this.diff].shuffles;t++){const n=this.getValidMoves(e),s=n[Math.floor(Math.random()*n.length)];this.swap(s,this.emptyIdx),this.emptyIdx=s}this.render(),this.updateScore()},getValidMoves(e){const t=[],n=this.emptyIdx%e,s=Math.floor(this.emptyIdx/e);return s>0&&t.push(this.emptyIdx-e),s<e-1&&t.push(this.emptyIdx+e),n>0&&t.push(this.emptyIdx-1),n<e-1&&t.push(this.emptyIdx+1),t},swap(e,t){const n=this.grid[e];this.grid[e]=this.grid[t],this.grid[t]=n},click(e){const t=config[this.diff].size;if(this.getValidMoves(t).includes(e)){this.swap(e,this.emptyIdx),this.emptyIdx=e,this.moves++,this.render(),this.updateScore();const t=this.grid.slice(0,-1).every((e,t)=>e===t+1);t&&(this.scoreEl.innerText=`Solved in ${this.moves} moves!`,this.grid=[])}},render(){this.container.innerHTML="";const e=config[this.diff].size;this.container.style.gridTemplateColumns=`repeat(${e}, 1fr)`,this.grid.forEach((e,t)=>{const n=document.createElement("div");n.className=`slider-cell ${e===0?"empty":""}`,n.innerText=e===0?"":e,e!==0&&(n.onclick=()=>this.click(t)),this.container.appendChild(n)})},updateScore(){this.scoreEl.innerText=`Moves: ${this.moves}`}};function setDifficulty(e){document.querySelectorAll(".diff-btn").forEach(e=>e.classList.remove("active")),event.target.classList.add("active"),game.diff=e,game.start()}game.start()</script>
