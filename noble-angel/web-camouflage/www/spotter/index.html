<!doctype html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Color Spotter - MD3</title>
<link rel=stylesheet href=md3-theme.css><style>#timer-bar{width:100%;height:8px;background:var(--md-sys-color-secondary-container);border-radius:4px;margin-bottom:24px;overflow:hidden}#timer-fill{height:100%;background:var(--md-sys-color-primary);width:100%;transition:width .1s linear}.diff-selector{margin-bottom:24px}#spotter-grid{display:grid;gap:4px;width:100%;max-width:360px;aspect-ratio:1/1}.spotter-cell{border-radius:8px;cursor:pointer;transition:transform .1s;-webkit-tap-highlight-color:transparent}.spotter-cell:active{transform:scale(.9)}</style><div class=card><h2>Color Spotter</h2><p class=desc>Find the tile with a slightly different color before time runs out!<div class=diff-selector><button class=diff-btn onclick='setDifficulty("easy")'>Easy</button>
<button class="diff-btn active" onclick='setDifficulty("medium")'>Medium</button>
<button class=diff-btn onclick='setDifficulty("hard")'>Hard</button></div><div id=timer-bar><div id=timer-fill></div></div><div id=spotter-grid></div><div class=stats id=spotter-score>Score: 0</div></div><script>const config={easy:{timeMod:1.2,startDelta:25},medium:{timeMod:1,startDelta:12},hard:{timeMod:.8,startDelta:6}},game={diff:"medium",score:0,level:2,time:100,timerId:null,grid:document.getElementById("spotter-grid"),scoreEl:document.getElementById("spotter-score"),timeEl:document.getElementById("timer-fill"),start(){this.score=0,this.level=2,this.time=100,clearInterval(this.timerId),this.timerId=setInterval(()=>this.tick(),100),this.render(),this.updateScore()},tick(){this.time-=1.5,this.timeEl.style.width=`${Math.max(0,this.time)}%`,this.time<=0&&(clearInterval(this.timerId),this.grid.innerHTML="",this.scoreEl.innerText=`Game Over! Final Score: ${this.score}`)},render(){this.grid.innerHTML="",this.grid.style.gridTemplateColumns=`repeat(${this.level}, 1fr)`;const e=this.level*this.level,t=Math.floor(Math.random()*e),n=Math.floor(Math.random()*360),s=Math.floor(Math.random()*40)+40,o=Math.floor(Math.random()*40)+30,i=config[this.diff].startDelta/Math.max(1,this.level*.4),a=`hsl(${n},${s}%,${o}%)`,r=`hsl(${n},${s}%,${o-i}%)`;for(let n=0;n<e;n++){const s=document.createElement("div");s.className="spotter-cell",s.style.backgroundColor=n===t?r:a,s.onclick=()=>n===t?this.nextLevel():(this.time-=15,this.tick()),this.grid.appendChild(s)}},nextLevel(){this.score++,this.score%3===0&&this.level<12&&this.level++,this.time=Math.min(100,this.time+15*config[this.diff].timeMod),this.render(),this.updateScore()},updateScore(){this.scoreEl.innerText=`Score: ${this.score}`}};function setDifficulty(e){document.querySelectorAll(".diff-btn").forEach(e=>e.classList.remove("active")),event.target.classList.add("active"),game.diff=e,game.start()}game.start()</script>
