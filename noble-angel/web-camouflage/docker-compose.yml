services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx:/etc/nginx/conf.d/
      - ./www:/var/www
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"
      - "traefik.http.routers.sequence.rule=Host(`sequence.${CAMO_DOMAIN}`)"
      - "traefik.http.routers.sequence.entrypoints=websecure"
      - "traefik.http.routers.sequence.tls.certresolver=myresolver"
      - "traefik.http.routers.sequence.service=nginx"
      - "traefik.http.routers.slider.rule=Host(`slider.${CAMO_DOMAIN}`)"
      - "traefik.http.routers.slider.entrypoints=websecure"
      - "traefik.http.routers.slider.tls.certresolver=myresolver"
      - "traefik.http.routers.slider.service=nginx"
      - "traefik.http.routers.spotter.rule=Host(`spotter.${CAMO_DOMAIN}`)"
      - "traefik.http.routers.spotter.entrypoints=websecure"
      - "traefik.http.routers.spotter.tls.certresolver=myresolver"
      - "traefik.http.routers.spotter.service=nginx"
      - "traefik.http.routers.click.rule=Host(`click.${CAMO_DOMAIN}`)"
      - "traefik.http.routers.click.entrypoints=websecure"
      - "traefik.http.routers.click.tls.certresolver=myresolver"
      - "traefik.http.routers.click.service=nginx"

networks:
  traefik-public:
    external: true
