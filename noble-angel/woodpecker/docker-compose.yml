services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3
    volumes:
      - woodpecker-server-data:/var/lib/woodpecker/
    networks:
      - traefik-public
      - woodpecker-network
    environment:
      - WOODPECKER_OPEN=false
      - WOODPECKER_ADMIN=${WOODPECKER_ADMIN}
      - WOODPECKER_HOST=https://${WOODPECKER_DOMAIN}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_FORGEJO=true
      - WOODPECKER_FORGEJO_URL=https://${FORGEJO_DOMAIN}
      - WOODPECKER_FORGEJO_CLIENT=${FORGEJO_CLIENT_ID}
      - WOODPECKER_FORGEJO_SECRET=${FORGEJO_CLIENT_SECRET}
      - WOODPECKER_PROMETHEUS_AUTH_TOKEN=${WOODPECKER_PROMETHEUS_AUTH_TOKEN}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.woodpecker-server.rule=Host(`${WOODPECKER_DOMAIN}`)"
      - "traefik.http.routers.woodpecker-server.entrypoints=websecure"
      - "traefik.http.routers.woodpecker-server.tls.certresolver=myresolver"
      - "traefik.http.services.woodpecker-server.loadbalancer.server.port=8000"

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3
    command: agent
    restart: always
    networks:
      - woodpecker-network
    depends_on:
      - woodpecker-server
    volumes:
      - woodpecker-agent-config:/etc/woodpecker
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}

volumes:
  woodpecker-server-data:
  woodpecker-agent-config:

networks:
  traefik-public:
    external: true
  woodpecker-network:
    external: false
