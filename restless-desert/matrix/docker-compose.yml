services:
  coturn:
    image: coturn/coturn:4.9.0-alpine3.23
    restart: always
    network_mode: host
    volumes:
      - "./coturn/turnserver.conf:/etc/turnserver.conf:ro"

  synapse:
    image: matrixdotorg/synapse:v1.149.1
    restart: always
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
      - SYNAPSE_SERVER_NAME=${MATRIX_DOMAIN}
      - SYNAPSE_REPORT_STATS=no
    volumes:
      - ./synapse:/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.synapse.rule=Host(`${MATRIX_DOMAIN}`) && (PathPrefix(`/_matrix`) || PathPrefix(`/_synapse`) || PathPrefix(`/.well-known/matrix`))"
      - "traefik.http.routers.synapse.entrypoints=websecure"
      - "traefik.http.routers.synapse.tls.certresolver=myresolver"
      - "traefik.http.routers.matrix-federation.rule=Host(`${MATRIX_DOMAIN}`)"
      - "traefik.http.routers.matrix-federation.entrypoints=matrix-federation"
      - "traefik.http.routers.matrix-federation.tls.certresolver=myresolver"
      - "traefik.http.services.synapse.loadbalancer.server.port=8008"
      - "traefik.http.routers.matrix-federation.service=synapse"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # main web client for the matrix server.
  # it is hosted on the same domain as matrix,
  # so there are rules for handling path prefixes.
  cinny:
    image: ghcr.io/cinnyapp/cinny:latest
    restart: always
    volumes:
      - ./cinny/config.json:/app/config.json:ro
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.cinny.rule=Host(`${CINNY_DOMAIN}`) && !PathPrefix(`/_matrix`) && !PathPrefix(`/_synapse`) && !PathPrefix(`/.well-known/matrix`)"
      - "traefik.http.routers.cinny.entrypoints=websecure"
      - "traefik.http.routers.cinny.tls.certresolver=myresolver"
      - "traefik.http.services.cinny.loadbalancer.server.port=80"

  element-web:
    image: vectorim/element-web:latest
    restart: always
    volumes:
      - ./element/config.json:/app/config.json:ro
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.element.rule=Host(`${ELEMENT_DOMAIN}`)"
      - "traefik.http.routers.element.entrypoints=websecure"
      - "traefik.http.routers.element.tls.certresolver=myresolver"
      - "traefik.http.services.element.loadbalancer.server.port=80"

  db:
    image: postgres:18.3-alpine3.23
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

networks:
  internal:
  traefik-public:
    external: true
