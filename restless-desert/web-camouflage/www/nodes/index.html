<!doctype html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Network Hub</title>
<link rel=stylesheet href=md3-theme.css><style>.node-container{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:8px}.node-link{display:flex;flex-direction:column;padding:16px;background:var(--md-sys-color-surface);border:1px solid var(--md-sys-color-outline-variant);border-radius:16px;text-decoration:none;color:var(--md-sys-color-on-primary-container);transition:none}.node-link:hover{background:var(--md-sys-color-primary-container);border-color:var(--md-sys-color-primary)}.node-name{font-size:1.1rem;font-weight:700;color:var(--md-sys-color-primary);margin-bottom:2px}.node-addr{font-size:.8rem;color:var(--md-sys-color-outline);font-family:roboto mono,monospace;letter-spacing:.5px}</style><div class=card><h2>Network Nodes</h2><div class=node-container id=nodes-list></div></div><script>const nodes=[{id:"wordle",name:"Wordle"},{id:"lockpicker",name:"Lock Picker"},{id:"lightsout",name:"Lights Out"},{id:"spotter",name:"Color Spotter"},{id:"slider",name:"Slider Puzzle"},{id:"sequence",name:"Sequence"},{id:"floodfill",name:"Flood Fill"},{id:"rubiks",name:"Rubik's Cube"},{id:"tower",name:"Tower Stack"},{id:"shulte",name:"Schulte Table"},{id:"tetris",name:"Tetris"},{id:"field",name:"Field"},{id:"click",name:"CPS"}],list=document.getElementById("nodes-list"),domain="example.com";nodes.forEach(e=>{const t=document.createElement("a");t.className="node-link",t.href=`https://${e.id}.${domain}`,t.innerHTML=`
                <span class="node-name">${e.name}</span>
                <span class="node-addr">${e.id}.${domain}</span>
            `,list.appendChild(t)})</script>
