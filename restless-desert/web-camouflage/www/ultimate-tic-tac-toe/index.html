<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Ultimate Tic Tac Toe</title><meta name="viewport" content="width=device-width,initial-scale=1"><style> body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b1220; font-family: Inter, system-ui, Arial; color: #fff; } .wrap { display: flex; flex-direction: column; gap: 12px; align-items: center; } .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #333; padding: 8px; border-radius: 10px; } .mini-board { display: grid; grid-template-columns: repeat(3, 40px); grid-auto-rows: 40px; gap: 2px; background: #222; padding: 4px; border-radius: 6px; position: relative; transition: box-shadow 0.2s, transform 0.2s; } .cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #dbe7ff; color: #0b1220; font-size: 22px; font-weight: bold; border-radius: 4px; cursor: pointer; user-select: none; } .cell.disabled { background: #8aa0c4; cursor: default; } .mini-board.won::after { content: attr(data-winner); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 900; color: #fff; background: rgba(0,0,0,0.6); border-radius: 6px; } .mini-board.active { box-shadow: 0 0 10px 3px #4cafef; transform: scale(1.03); } .info { margin: 8px; font-size: 16px; } button { padding: 6px 12px; border: none; border-radius: 6px; background: #1f2a44; color: #dbe7ff; cursor: pointer; }</style></head><body><div class="wrap"><div class="info">Turn: <span id="turn">X</span></div><div class="board" id="board"></div><button id="reset">New Game</button><div class="info" id="status"></div></div><script> const boardEl = document.getElementById('board'); const turnEl = document.getElementById('turn'); const statusEl = document.getElementById('status'); const resetBtn = document.getElementById('reset'); let turn = 'X'; let globalWin = null; let nextBoard = null; let boards = []; function init() { turn = 'X'; globalWin = null; nextBoard = null; boards = []; boardEl.innerHTML = ''; for (let r = 0; r < 3; r++) { const row = []; for (let c = 0; c < 3; c++) { const mini = document.createElement('div'); mini.className = 'mini-board'; mini.dataset.r = r; mini.dataset.c = c; const cells = []; for (let i = 0; i < 9; i++) { const cell = document.createElement('div'); cell.className = 'cell'; cell.dataset.i = i; cell.addEventListener('click', () => handleMove(r, c, i, cell)); mini.appendChild(cell); cells.push(cell); } boardEl.appendChild(mini); row.push({ el: mini, cells: cells, winner: null }); } boards.push(row); } updateInfo(); } function handleMove(r, c, i, cell) { if (globalWin || boards[r][c].winner) return; if (cell.textContent !== '') return; if (nextBoard && (nextBoard.r !== r || nextBoard.c !== c) && !boards[nextBoard.r][nextBoard.c].winner) { return; } cell.textContent = turn; checkMiniWin(r, c); const nr = Math.floor(i / 3); const nc = i % 3; if (!boards[nr][nc].winner) { nextBoard = { r: nr, c: nc }; } else { nextBoard = null; } checkGlobalWin(); turn = turn === 'X' ? 'O' : 'X'; updateInfo(); } function checkMiniWin(r, c) { const mini = boards[r][c]; const vals = mini.cells.map(cell => cell.textContent); const lines = [ [0,1,2],[3,4,5],[6,7,8], [0,3,6],[1,4,7],[2,5,8], [0,4,8],[2,4,6] ]; for (const line of lines) { const [a,b,c2] = line; if (vals[a] && vals[a] === vals[b] && vals[a] === vals[c2]) { mini.winner = vals[a]; mini.el.classList.add('won'); mini.el.dataset.winner = vals[a]; return; } } if (vals.every(v => v)) { mini.winner = 'D'; mini.el.classList.add('won'); mini.el.dataset.winner = '-'; } } function checkGlobalWin() { const grid = boards.map(row => row.map(m => m.winner)); const lines = [ [[0,0],[0,1],[0,2]],[[1,0],[1,1],[1,2]],[[2,0],[2,1],[2,2]], [[0,0],[1,0],[2,0]],[[0,1],[1,1],[2,1]],[[0,2],[1,2],[2,2]], [[0,0],[1,1],[2,2]],[[0,2],[1,1],[2,0]] ]; for (const line of lines) { const [a,b,c] = line; const va = grid[a[0]][a[1]]; if (va && va !== 'D' && va === grid[b[0]][b[1]] && va === grid[c[0]][c[1]]) { globalWin = va; statusEl.innerText = `${va} wins!`; return; } } if (grid.flat().every(v => v)) { globalWin = 'D'; statusEl.innerText = 'Draw'; } } function updateInfo() { if (globalWin) return; turnEl.innerText = turn; document.querySelectorAll('.mini-board').forEach(el => el.classList.remove('active')); if (nextBoard) { statusEl.innerText = `Play in board (${nextBoard.r + 1}, ${nextBoard.c + 1})`; boards[nextBoard.r][nextBoard.c].el.classList.add('active'); } else { statusEl.innerText = 'Play in any board'; boards.flat().filter(m => !m.winner).forEach(m => m.el.classList.add('active')); } } resetBtn.addEventListener('click', init); init();</script></body></html>
