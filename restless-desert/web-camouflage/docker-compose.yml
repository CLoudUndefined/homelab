services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx:/etc/nginx/conf.d/
      - ./www:/var/www
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"
      - "traefik.http.routers.tetris.rule=Host(`tetris.${CAMO_DOMAIN}`)"
      - "traefik.http.routers.tetris.entrypoints=websecure"
      - "traefik.http.routers.tetris.tls.certresolver=myresolver"
      - "traefik.http.routers.tetris.service=nginx"
      - "traefik.http.routers.minesweeper.rule=Host(`minesweeper.${CAMO_DOMAIN}`)"
      - "traefik.http.routers.minesweeper.entrypoints=websecure"
      - "traefik.http.routers.minesweeper.tls.certresolver=myresolver"
      - "traefik.http.routers.minesweeper.service=nginx"
      - "traefik.http.routers.tic-tac-toe.rule=Host(`tic-tac-toe.${CAMO_DOMAIN}`)"
      - "traefik.http.routers.tic-tac-toe.entrypoints=websecure"
      - "traefik.http.routers.tic-tac-toe.tls.certresolver=myresolver"
      - "traefik.http.routers.tic-tac-toe.service=nginx"
      - "traefik.http.routers.nodes.rule=Host(`nodes.${CAMO_DOMAIN}`)"
      - "traefik.http.routers.nodes.entrypoints=websecure"
      - "traefik.http.routers.nodes.tls.certresolver=myresolver"
      - "traefik.http.routers.nodes.service=nginx"
      - "traefik.http.routers.field.rule=Host(`field.${CAMO_DOMAIN}`)"
      - "traefik.http.routers.field.entrypoints=websecure"
      - "traefik.http.routers.field.tls.certresolver=myresolver"
      - "traefik.http.routers.field.service=nginx"

networks:
  traefik-public:
    external: true
