<!doctype html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Lights Out - MD3</title>
<link rel=stylesheet href=md3-theme.css><style>#lights-grid{display:grid;gap:8px;width:100%;max-width:360px;aspect-ratio:1/1}.light-cell{background-color:var(--md-sys-color-secondary-container);border-radius:12px;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);user-select:none;-webkit-tap-highlight-color:transparent}.light-cell.on{background-color:#ffd166;box-shadow:0 0 16px rgba(255,209,102,.8);transform:scale(.92)}</style><div class=card><h2>Lights Out</h2><p class=desc>Turn off all the lights. A click toggles the cell and its neighbors.<div class=diff-selector><button class=diff-btn onclick='setDifficulty("easy")'>4x4</button>
<button class="diff-btn active" onclick='setDifficulty("medium")'>5x5</button>
<button class=diff-btn onclick='setDifficulty("hard")'>6x6</button></div><div id=lights-grid></div><div class=stats id=lights-score>Clicks: 0</div><button class=btn-primary onclick=lightsGame.start()>Restart</button></div><script>const config={easy:{size:4},medium:{size:5},hard:{size:6}},lightsGame={diff:"medium",grid:[],clicks:0,container:document.getElementById("lights-grid"),scoreEl:document.getElementById("lights-score"),start(){const e=config[this.diff].size;this.clicks=0,this.grid=Array.from({length:e},()=>Array(e).fill(!1)),this.container.style.gridTemplateColumns=`repeat(${e}, 1fr)`;const t=e*e*1.5;for(let n=0;n<t;n++)this.toggleSilent(Math.floor(Math.random()*e),Math.floor(Math.random()*e));this.render(),this.updateScore()},toggleSilent(e,t){const n=config[this.diff].size;[[0,0],[0,1],[0,-1],[1,0],[-1,0]].forEach(([s,o])=>{const i=e+s,a=t+o;i>=0&&i<n&&a>=0&&a<n&&(this.grid[a][i]=!this.grid[a][i])})},click(e,t){this.clicks++,this.toggleSilent(e,t),this.render(),this.updateScore(),this.checkWin()},render(){this.container.innerHTML="";const e=config[this.diff].size;for(let t=0;t<e;t++)for(let n=0;n<e;n++){const s=document.createElement("div");s.className=`light-cell ${this.grid[t][n]?"on":""}`,s.onclick=()=>this.click(n,t),this.container.appendChild(s)}},checkWin(){const e=this.grid.every(e=>e.every(e=>!e));e&&(this.scoreEl.innerText=`Solved in ${this.clicks} clicks!`)},updateScore(){this.scoreEl.innerText=`Clicks: ${this.clicks}`}};function setDifficulty(e){document.querySelectorAll(".diff-btn").forEach(e=>e.classList.remove("active")),event.target.classList.add("active"),lightsGame.diff=e,lightsGame.start()}lightsGame.start()</script>
