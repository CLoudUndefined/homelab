<button class=diff-btn onclick='setDifficulty("hard")'>Hard</button></div><div id=flood-grid></div><div class=color-controls id=flood-controls></div><div class=stats id=flood-score>Moves: 0</div></div><script>const allColors=["#EF476F","#FFD166","#06D6A0","#118AB2","#073B4C","#9D4EDD"],config={easy:{size:8,colors:4,moves:15},medium:{size:12,colors:5,moves:25},hard:{size:16,colors:6,moves:35}},floodGame={diff:"medium",grid:[],moves:0,container:document.getElementById("flood-grid"),controls:document.getElementById("flood-controls"),scoreEl:document.getElementById("flood-score"),start(){const e=config[this.diff];this.moves=0,this.grid=Array.from({length:e.size},()=>Array.from({length:e.size},()=>Math.floor(Math.random()*e.colors))),this.container.style.gridTemplateColumns=`repeat(${e.size}, 1fr)`,this.renderGrid(),this.renderControls(),this.updateScore()},renderGrid(){this.container.innerHTML="";const e=config[this.diff];for(let t=0;t<e.size;t++)for(let n=0;n<e.size;n++){const s=document.createElement("div");s.className="flood-cell",s.style.backgroundColor=allColors[this.grid[t][n]],this.container.appendChild(s)}},renderControls(){this.controls.innerHTML="";const e=config[this.diff];for(let t=0;t<e.colors;t++){const n=document.createElement("button");n.className="color-btn",n.style.backgroundColor=allColors[t],n.onclick=()=>this.playMove(t),this.controls.appendChild(n)}},playMove(e){if(this.moves>=config[this.diff].moves)return;const t=this.grid[0][0];if(t===e)return;this.moves++,this.floodFill(0,0,t,e),this.renderGrid(),this.updateScore(),this.checkWin()},floodFill(e,t,n,s){const o=config[this.diff].size;if(e<0||e>=o||t<0||t>=o)return;if(this.grid[t][e]!==n)return;this.grid[t][e]=s,this.floodFill(e+1,t,n,s),this.floodFill(e-1,t,n,s),this.floodFill(e,t+1,n,s),this.floodFill(e,t-1,n,s)},checkWin(){const e=this.grid[0][0],t=this.grid.every(t=>t.every(t=>t===e));t?this.scoreEl.innerText="You win!":this.moves>=config[this.diff].moves&&(this.scoreEl.innerText="Game Over :("
