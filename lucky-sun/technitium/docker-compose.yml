services:
  technitium:
    image: technitium/dns-server:latest
    container_name: technitium
    restart: unless-stopped
    networks:
      - traefik-public
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./technitium:/etc/dns
    environment:
      - DNS_SERVER_DOMAIN=${TECHNITIUM_DOMAIN}
      - DNS_SERVER_ADMIN_PASSWORD=${TECHNITIUM_ADMIN_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.technitium.rule=Host(`${TECHNITIUM_DOMAIN}`)"
      - "traefik.http.routers.technitium.entrypoints=websecure"
      - "traefik.http.routers.technitium.tls.certresolver=myresolver"
      - "traefik.http.routers.technitium.service=technitium"
      - "traefik.http.services.technitium.loadbalancer.server.port=5380"
      - "traefik.http.routers.doh.rule=Host(`${TECHNITIUM_DOMAIN}`) && Path(`/dns-query`)"
      - "traefik.http.routers.doh.entrypoints=websecure"
      - "traefik.http.routers.doh.tls.certresolver=myresolver"
      - "traefik.http.routers.doh.service=doh"
      - "traefik.http.services.doh.loadbalancer.server.port=8053"
      - "traefik.tcp.routers.dot.entrypoints=dot"
      - "traefik.tcp.routers.dot.rule=HostSNI(`${TECHNITIUM_DOMAIN}`)"
      - "traefik.tcp.routers.dot.tls=true"
      - "traefik.tcp.routers.dot.tls.certresolver=myresolver"
      - "traefik.tcp.routers.dot.service=dot"
      - "traefik.tcp.services.dot.loadbalancer.server.port=53"

networks:
  traefik-public:
    external: true
