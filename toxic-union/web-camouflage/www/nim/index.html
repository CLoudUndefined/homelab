<!doctype html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Nim - MD3</title><link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com crossorigin><link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"><link rel=stylesheet href=theme.css><style>:root{--game-ease:cubic-bezier(0.2, 0, 0, 1)}.play-frame{width:100%;box-sizing:border-box;background:var(--md-sys-color-background);border-radius:14px;padding:16px}.heap{display:flex;flex-wrap:wrap;justify-content:center;margin:4px 0}.token{position:relative;width:44px;height:44px;padding:0;border:none;background:0 0;cursor:pointer}.token::before{content:"";position:absolute;inset:7px;box-sizing:border-box;border-radius:50%;background:var(--md-sys-color-primary-container);border:2px solid var(--md-sys-color-primary);transition:background .15s var(--game-ease)}.token:hover::before,.token.preview::before{background:var(--md-sys-color-primary)}.token.gone{visibility:hidden}.status-line{min-height:1.5em;margin:12px 0;font-size:.95rem;line-height:1.5;text-align:center;color:var(--md-sys-color-outline)}.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:10px;width:100%}.stat-chip{display:flex;flex-direction:column;align-items:center;gap:2px;box-sizing:border-box;width:100%;min-width:0;padding:8px 12px;border-radius:10px;background:var(--md-sys-color-secondary-container)}.stat-chip .k{font-size:.8rem;font-weight:600;letter-spacing:.01em;color:var(--md-sys-color-outline)}.stat-chip .v{font-variant-numeric:tabular-nums;font-size:1.15rem;font-weight:700;color:var(--md-sys-color-on-primary-container)}.btn-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 20px;border:none;border-radius:10px;font-family:inherit;font-size:.95rem;font-weight:600;letter-spacing:.01em;cursor:pointer;transition:background .15s var(--game-ease);-webkit-tap-highlight-color:transparent}.btn-filled{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}.btn-filled:hover{background:#ffad45}.btn:focus-visible{outline:2.5px solid var(--md-sys-color-primary);outline-offset:2px}@media(max-width:560px){.card{padding:20px 16px;border-radius:16px}h2{font-size:1.5rem}.stat-chip .v{font-size:1.05rem}}@media(max-height:820px){.play-frame{padding:12px}.status-line{margin:8px 0}.stat-row{gap:8px}.stat-chip{padding:6px 8px}.stat-chip .v{font-size:1.05rem}.btn-row{margin-top:12px}}</style><div class=card><h2>Nim</h2><p class=desc>Click a token to take it and every token to its right in that row. Take the last token to win. The opponent plays perfectly.<div class=play-frame><div id=heaps></div></div><div class=status-line id=status></div><div class=stat-row><div class=stat-chip><span class=k>Wins</span><span class=v id=wins>0</span></div><div class=stat-chip><span class=k>Streak</span><span class=v id=streak>0</span></div></div><div class=btn-row><button class="btn btn-filled" id=new>New game</button></div></div><div class=toast id=toast></div><script>let heaps=[],busy=!1,wins=0,streak=0;function toast(e){const t=document.getElementById("toast");t.textContent=e,t.classList.add("show"),setTimeout(()=>t.classList.remove("show"),1800)}function render(){const e=document.getElementById("heaps");e.innerHTML="",heaps.forEach((t,n)=>{const s=document.createElement("div");s.className="heap";for(let o=0;o<t;o++){const e=document.createElement("div");e.className="token",busy&&(e.style.cursor="default"),e.addEventListener("mouseenter",()=>{if(busy)return;s.querySelectorAll(".token").forEach((e,t)=>e.classList.toggle("preview",t>=o))}),e.addEventListener("mouseleave",()=>s.querySelectorAll(".token").forEach(e=>e.classList.remove("preview"))),e.addEventListener("click",()=>playerTake(n,t-o)),s.appendChild(e)}e.appendChild(s)})}function xorAll(){return heaps.reduce((e,t)=>e^t,0)}function allGone(){return heaps.every(e=>e===0)}function playerTake(e,t){if(busy||heaps[e]<t)return;if(heaps[e]-=t,allGone()){render(),wins++,streak++,document.getElementById("wins").textContent=wins,document.getElementById("streak").textContent=streak,toast("You took the last token. You win."),document.getElementById("status").textContent="Victory. Start a new game.",busy=!0;return}busy=!0,render(),setTimeout(aiMove,550)}function aiMove(){const n=xorAll();let e=-1,t=0;if(n!==0)for(let s=0;s<heaps.length;s++){const o=heaps[s]^n;if(o<heaps[s]){e=s,t=heaps[s]-o;break}}if(e===-1&&(e=heaps.indexOf(Math.max(...heaps)),t=1),heaps[e]-=t,document.getElementById("status").textContent="Opponent takes "+t+" from heap "+(e+1)+".",allGone()){render(),streak=0,document.getElementById("streak").textContent=streak,toast("Opponent took the last token. You lose."),document.getElementById("status").textContent="Defeat. Start a new game.";return}busy=!1,render()}function newGame(){do heaps=Array.from({length:4},()=>2+Math.floor(Math.random()*8));while(xorAll()===0)busy=!1,document.getElementById("status").textContent="Your move.",render()}document.getElementById("new").addEventListener("click",newGame),newGame()</script>
